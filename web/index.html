<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDR remote</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #05070a;
    --bar: #10151c;
    --line: #232c38;
    --text: #d5dde8;
    --muted: #7f8c9d;
    --ok: #3ddc84;
    --warn: #f0b429;
    --bad: #ff5c5c;
    --accent: #4aa3ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  #status { display: flex; align-items: center; gap: 8px; margin-right: auto; color: var(--muted); }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
  #dot.ok { background: var(--ok); }
  #dot.bad { background: var(--bad); }

  button { font: inherit; color: var(--text); background: #1a222d; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button:hover { background: #222d3b; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #04121f; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #6bb5ff; }
  label.vol { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  [hidden] { display: none !important; }
  select { font: inherit; color: var(--text); background: #1a222d; border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; max-width: 200px; }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg { color: var(--muted); font-size: 12px; max-width: 260px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .msg.err { color: var(--bad); }
  .msg:empty { display: none; }
  button.warn { border-color: var(--bad); color: var(--bad); }

  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden; }
  canvas { display: block; background: #000; touch-action: none; user-select: none;
    -webkit-user-select: none; cursor: default; image-rendering: auto; }
  #stage:fullscreen { background: #000; }
</style>
</head>
<body>
<header>
  <div id="status"><span id="dot"></span><span id="statusText">Connecting</span></div>
  <label class="vol" id="sinkWrap" hidden>Output <select id="sink" aria-label="Audio output device"></select></label>
  <button id="namesBtn" type="button" hidden title="Ask the browser for permission so it shows real device names">Show names</button>
  <span id="sinkMsg" class="msg" role="status" aria-live="polite"></span>
  <label class="vol">Volume <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume"></label>
  <button id="audioBtn" class="primary" type="button">Start audio</button>
  <span id="audioMsg" class="msg" role="status" aria-live="polite"></span>
  <label class="vol" id="micWrap">Mic <select id="mic" aria-label="Microphone input device"></select></label>
  <button id="micBtn" class="primary" type="button">Start mic</button>
  <span id="micMsg" class="msg" role="status" aria-live="polite"></span>
  <button id="rotBtn" type="button" title="Rotate the view by 90 degrees">Rotate</button>
  <button id="fsBtn" type="button">Full screen</button>
</header>
<div id="stage"><canvas id="c" width="1280" height="720" tabindex="0"></canvas></div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const audioBtn = document.getElementById('audioBtn');
  const volEl = document.getElementById('vol');

  // ---------- layout: fit canvas into the stage, keep aspect ratio ----------
  let rot = 0;                                   // view rotation in degrees: 0, 90, 180, 270 (clockwise)

  function fit() {
    const r = stage.getBoundingClientRect();
    const swapped = rot % 180 !== 0;             // at 90/270 the picture is as wide as the canvas is tall
    const vw = swapped ? cv.height : cv.width;
    const vh = swapped ? cv.width  : cv.height;
    const s = Math.min(r.width / vw, r.height / vh);
    cv.style.width  = Math.floor(cv.width  * s) + 'px';   // unrotated layout size
    cv.style.height = Math.floor(cv.height * s) + 'px';
    cv.style.transform = `rotate(${rot}deg)`;             // rotates around the canvas centre
  }
  new ResizeObserver(fit).observe(stage);

  function setStatus(text, cls) {
    statusText.textContent = text;
    dot.className = cls || '';
  }

  // ---------- WebSocket ----------
  let ws = null;
  let chain = Promise.resolve();      // keeps async-decoded tiles in draw order
  let retryTimer = null;

  function connect() {
    clearTimeout(retryTimer);
    setStatus('Connecting');
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => setStatus('Connected', 'ok');
    ws.onclose = () => {
      setStatus('Disconnected, retrying', 'bad');
      retryTimer = setTimeout(connect, 1000);
    };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };

    ws.onmessage = (e) => {
      const v = new DataView(e.data);
      switch (v.getUint8(0)) {
        case 0: {                                  // init: [0][u16 w][u16 h]
          cv.width  = v.getUint16(1, true);
          cv.height = v.getUint16(3, true);
          ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
          fit();
          setStatus(`Connected ${cv.width}\u00d7${cv.height}`, 'ok');
          break;
        }
        case 1: {                                  // tile: [1][codec][x][y][w][h][payload]
          const x = v.getUint16(2, true), y = v.getUint16(4, true);
          const mime = v.getUint8(1) === 0 ? 'image/jpeg' : 'image/webp';
          const bmp = createImageBitmap(new Blob([e.data.slice(10)], { type: mime }),
                                        { colorSpaceConversion: 'none' });
          chain = chain
            .then(() => bmp)
            .then(b => { ctx.drawImage(b, x, y); b.close(); })
            .catch(() => {});
          break;
        }
        case 2: {                                  // audio: [2][u32 seq][opus]
          rxPackets++;
          if (decoder && decoder.state === 'configured' && decoder.decodeQueueSize < 10) {
            decoder.decode(new EncodedAudioChunk({
              type: 'key',
              timestamp: v.getUint32(1, true) * 20000,   // 20 ms frames, microseconds
              data: e.data.slice(5)
            }));
          }
          break;
        }
      }
    };
  }

  // ---------- audio ----------
  let ac = null, node = null, gain = null, decoder = null, audioState = 'off';
  let rxPackets = 0, rxPeak = 0;                 // per-second receive statistics for the status message

  // ---------- output device selection (Chromium: AudioContext.setSinkId) ----------
  const sinkSel  = document.getElementById('sink');
  const sinkWrap = document.getElementById('sinkWrap');
  const namesBtn = document.getElementById('namesBtn');
  const canSink = typeof AudioContext !== 'undefined' && 'setSinkId' in AudioContext.prototype &&
                  !!(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices);

  const sinkMsgEl = document.getElementById('sinkMsg');
  function sinkMsg(text, isErr) { sinkMsgEl.textContent = text; sinkMsgEl.classList.toggle('err', !!isErr); }

  // Second route: play the graph through a hidden <audio> element, whose setSinkId() is more widely
  // supported than AudioContext.setSinkId(). Used automatically if the first route does not take effect.
  let viaElement = false, dest = null, outEl = null;
  function enableElementRoute() {
    if (!('setSinkId' in HTMLMediaElement.prototype)) return false;
    if (!dest) {
      dest = ac.createMediaStreamDestination();
      outEl = new Audio();
      outEl.srcObject = dest.stream;
    }
    gain.disconnect();
    gain.connect(dest);
    outEl.play().catch(err => console.warn('audio element play failed', err));
    viaElement = true;
    return true;
  }

  async function applySink() {
    if (!ac) return;                              // applied when audio starts
    const id = sinkSel.value;                     // '' = system default
    const opt = sinkSel.selectedOptions[0];
    const name = opt ? opt.text : 'default';

    if (!viaElement) {
      try {
        await ac.setSinkId(id);
        if (typeof ac.sinkId !== 'string' || ac.sinkId === id) { sinkMsg('Output: ' + name); return; }
        console.warn('AudioContext.setSinkId resolved but sinkId is', ac.sinkId, 'wanted', id);
      } catch (err) {
        console.warn('AudioContext.setSinkId failed', err);
      }
      if (!enableElementRoute()) { sinkMsg('Could not switch to ' + name, true); return; }
    }
    try {
      await outEl.setSinkId(id);
      sinkMsg('Output: ' + name);
    } catch (err) {
      console.warn('audio element setSinkId failed', err);
      sinkMsg(`Could not switch to ${name} (${err.name || 'error'})`, true);
    }
  }

  async function loadSinks() {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audiooutput');
    let want = '';
    try { want = localStorage.getItem('sink') || ''; } catch (_) {}
    sinkSel.replaceChildren(new Option('System default', ''));
    devs.forEach((d, i) => {
      if (d.deviceId === 'default' || d.deviceId === 'communications') return;
      sinkSel.add(new Option(d.label || `Output ${i + 1}`, d.deviceId));   // labels can be empty without permission
    });
    sinkSel.value = [...sinkSel.options].some(o => o.value === want) ? want : '';
    const named = devs.filter(d => d.label && d.deviceId !== 'default' && d.deviceId !== 'communications');
    namesBtn.hidden = named.length > 0;           // real output names present: nothing left to unlock
    await applySink();
    return named.length;
  }

  sinkSel.addEventListener('change', () => {
    try { localStorage.setItem('sink', sinkSel.value); } catch (_) {}
    applySink();
  });
  if (canSink) navigator.mediaDevices.addEventListener('devicechange', () => loadSinks().catch(() => {}));

  // Browsers only reveal device names after a media permission is granted. Ask once, then stop the
  // microphone straight away: nothing is recorded or sent, the grant is only used to unlock the names.
  // Some browsers list microphones by name after that grant but keep speaker names hidden. Those that
  // support selectAudioOutput() show their own output picker instead, and return the device chosen.
  namesBtn.addEventListener('click', async () => {
    let micDenied = false, named = 0;
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      s.getTracks().forEach(t => t.stop());
      loadMics().catch(() => {});                 // microphone names are unlocked by the same permission
    } catch (err) { console.warn('getUserMedia failed', err); micDenied = true; }

    try { named = (await loadSinks()) || 0; } catch (_) {}
    if (named) return;

    if (navigator.mediaDevices.selectAudioOutput) {
      try {
        const d = await navigator.mediaDevices.selectAudioOutput();
        if (![...sinkSel.options].some(o => o.value === d.deviceId))
          sinkSel.add(new Option(d.label || 'Selected output', d.deviceId));
        sinkSel.value = d.deviceId;
        try { localStorage.setItem('sink', d.deviceId); } catch (_) {}
        await applySink();
        return;
      } catch (err) { console.warn('selectAudioOutput failed', err); }
    }
    namesBtn.textContent = micDenied ? 'Permission denied' : 'Names unavailable';
    namesBtn.disabled = true;
  });

  async function startAudio() {
    if (!('AudioDecoder' in window)) {
      setStatus('Audio needs a secure page (https) and a browser with WebCodecs', 'bad');
      return;
    }
    ac = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
    await ac.audioWorklet.addModule('worklet.js');
    node = new AudioWorkletNode(ac, 'pcm', { numberOfInputs: 0, outputChannelCount: [1] });
    gain = ac.createGain();
    gain.gain.value = volEl.value / 100;
    node.connect(gain).connect(ac.destination);
    if (canSink) await loadSinks().catch(() => {});   // fills the list and applies the saved choice

    decoder = new AudioDecoder({
      output: (ad) => {
        const f = new Float32Array(ad.numberOfFrames);
        ad.copyTo(f, { planeIndex: 0, format: 'f32-planar' });
        for (let i = 0; i < f.length; i++) { const a = Math.abs(f[i]); if (a > rxPeak) rxPeak = a; }
        node.port.postMessage(f, [f.buffer]);
        ad.close();
      },
      error: (err) => console.error('AudioDecoder', err)
    });
    const cfg = { codec: 'opus', sampleRate: 48000, numberOfChannels: 1 };
    const sup = await AudioDecoder.isConfigSupported(cfg);
    if (!sup.supported) { setStatus('This browser cannot decode Opus', 'bad'); return; }
    decoder.configure(cfg);
    audioState = 'on';
    const audioMsgEl = document.getElementById('audioMsg');
    setInterval(() => {                           // tells you where the audio stops
      if (audioState === 'muted') { audioMsgEl.textContent = ''; rxPackets = 0; rxPeak = 0; return; }
      let text, err = true;
      if (!ws || ws.readyState !== 1)  text = 'Audio: not connected';
      else if (rxPackets === 0)        text = 'Audio: no packets from the Pi';
      else if (rxPeak < 0.0005)        text = 'Audio: packets arrive but the sound is silent';
      else { text = `Audio: ${rxPackets} packets/s, level ${rxPeak.toFixed(2)}`; err = false; }
      audioMsgEl.textContent = text;
      audioMsgEl.classList.toggle('err', err);
      rxPackets = 0; rxPeak = 0;
    }, 1000);
    audioBtn.textContent = 'Mute';
    audioBtn.classList.remove('primary');
  }

  audioBtn.addEventListener('click', async () => {
    if (audioState === 'off') {
      try { await startAudio(); }
      catch (err) {
        console.warn('startAudio failed', err);
        if (ac) { try { ac.close(); } catch (_) {} ac = null; }
        const m = document.getElementById('audioMsg');
        m.textContent = 'Audio failed to start: ' + ((err && err.message) || err);
        m.classList.add('err');
      }
      return;
    }          // needs this user gesture
    if (audioState === 'on')  { await ac.suspend(); audioState = 'muted'; audioBtn.textContent = 'Unmute'; return; }
    await ac.resume(); audioState = 'on'; audioBtn.textContent = 'Mute';
  });
  volEl.addEventListener('input', () => { if (gain) gain.gain.value = volEl.value / 100; });

  // ---------- TX audio: microphone -> Opus -> WebSocket ----------
  const micSel   = document.getElementById('mic');
  const micBtn   = document.getElementById('micBtn');
  const micMsgEl = document.getElementById('micMsg');
  // Raw microphone by default: for SSB you normally set the level on the radio, not in the browser.
  const MIC_CONSTRAINTS = { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false };
  const TX_CFG = { codec: 'opus', sampleRate: 48000, numberOfChannels: 1, bitrate: 32000,
                   opus: { application: 'voip', signal: 'voice', frameDuration: 20000 } };
  let txActive = false, txMuted = false, txStream = null, txCtx = null, txEnc = null, txSeq = 0, txFrames = 0;
  let txSent = 0, txTimer = 0;                          // packets per second shown next to the mic button

  function micMsg(text, isErr) { micMsgEl.textContent = text; micMsgEl.classList.toggle('err', !!isErr); }

  function micUi() {
    micBtn.classList.toggle('primary', !txActive);
    micBtn.classList.toggle('warn', txActive && txMuted);
    micBtn.textContent = !txActive ? 'Start mic' : txMuted ? 'Unmute mic' : 'Mute mic';
    micBtn.setAttribute('aria-pressed', String(txActive && txMuted));
    if (txActive) micMsg(txMuted ? 'Mic muted' : 'Mic live');
  }

  async function loadMics() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
    const devs = (await navigator.mediaDevices.enumerateDevices())
      .filter(d => d.kind === 'audioinput' && d.deviceId !== 'default' && d.deviceId !== 'communications');
    let want = '';
    try { want = localStorage.getItem('mic') || ''; } catch (_) {}
    micSel.replaceChildren(new Option('System default', ''));
    devs.forEach((d, i) => micSel.add(new Option(d.label || `Microphone ${i + 1}`, d.deviceId)));
    micSel.value = [...micSel.options].some(o => o.value === want) ? want : '';
  }

  function sendTxChunk(chunk) {
    if (txMuted || !ws || ws.readyState !== 1) return;
    if (ws.bufferedAmount > 64 * 1024) return;          // network stalled: drop instead of building latency
    const m = new Uint8Array(5 + chunk.byteLength);
    m[0] = 0x13;
    new DataView(m.buffer).setUint32(1, txSeq++ >>> 0, true);
    chunk.copyTo(m.subarray(5));
    ws.send(m);
    txSent++;
  }

  async function startTx() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('needs https');
    if (!('AudioEncoder' in window)) throw new Error('no AudioEncoder');
    const sup = await AudioEncoder.isConfigSupported(TX_CFG);
    if (!sup.supported) throw new Error('no Opus encoder');

    const id = micSel.value;                            // '' = system default
    try {
      txStream = await navigator.mediaDevices.getUserMedia(
        { audio: { ...MIC_CONSTRAINTS, ...(id ? { deviceId: { exact: id } } : {}) } });
    } catch (err) {
      if (err.name === 'OverconstrainedError' && id) {  // the saved device is gone: use the default
        micSel.value = '';
        txStream = await navigator.mediaDevices.getUserMedia({ audio: MIC_CONSTRAINTS });
      } else throw err;
    }
    txStream.getAudioTracks().forEach(t => { t.enabled = !txMuted; });

    txEnc = new AudioEncoder({ output: sendTxChunk, error: (e) => console.warn('AudioEncoder', e) });
    txEnc.configure(TX_CFG);

    // Own AudioContext, so muting or suspending the receive audio never affects the microphone.
    txCtx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
    await txCtx.audioWorklet.addModule('worklet.js');
    if (txCtx.state === 'suspended') await txCtx.resume();
    const src = txCtx.createMediaStreamSource(txStream);
    const cap = new AudioWorkletNode(txCtx, 'capture', { numberOfInputs: 1, numberOfOutputs: 1,
                                                          outputChannelCount: [1], processorOptions: { frame: 960 } });
    const silent = txCtx.createGain();                  // silent sink: keeps the worklet running, nothing is heard
    silent.gain.value = 0;
    src.connect(cap);
    cap.connect(silent).connect(txCtx.destination);

    cap.port.onmessage = (e) => {
      if (txMuted || !txEnc || txEnc.state !== 'configured' || txEnc.encodeQueueSize > 4) return;
      const f = e.data;                                 // Float32Array, 960 samples = 20 ms
      const ad = new AudioData({ format: 'f32', sampleRate: 48000, numberOfFrames: f.length,
                                  numberOfChannels: 1, timestamp: txFrames++ * 20000, data: f });
      txEnc.encode(ad);
      ad.close();
    };

    txActive = true;
    clearInterval(txTimer);
    txTimer = setInterval(() => {                       // shows whether packets really leave the browser
      if (!txActive || txMuted) { txSent = 0; return; }
      micMsg(txSent > 0 ? `Mic live, ${txSent} packets/s` : 'Mic live, but no packets are leaving the browser', txSent === 0);
      txSent = 0;
    }, 1000);
    loadMics().catch(() => {});                         // device names are available now
  }

  async function stopTx() {
    txActive = false;
    clearInterval(txTimer);
    if (txStream) txStream.getTracks().forEach(t => t.stop());
    txStream = null;
    if (txEnc && txEnc.state !== 'closed') { try { txEnc.close(); } catch (_) {} }
    txEnc = null;
    if (txCtx) { try { await txCtx.close(); } catch (_) {} }
    txCtx = null;
  }

  function txErrorText(err) {
    switch (err && err.name) {
      case 'NotAllowedError':  return 'Microphone permission denied';
      case 'NotFoundError':    return 'No microphone found';
      case 'NotReadableError': return 'Microphone is in use by another program';
    }
    const m = String((err && err.message) || err);
    if (m === 'needs https') return 'Microphone needs https';
    if (m === 'no AudioEncoder' || m === 'no Opus encoder') return 'This browser cannot encode Opus (use Chrome or Edge)';
    return 'Microphone error: ' + m;
  }

  async function startTxReporting() {
    try { await startTx(); micUi(); }
    catch (err) {
      console.warn('TX start failed', err);
      await stopTx();
      micMsg(txErrorText(err), true);
      micUi();
    }
  }

  micBtn.addEventListener('click', async () => {
    if (txActive) {                                     // running: the button is now the mute toggle
      txMuted = !txMuted;
      if (txStream) txStream.getAudioTracks().forEach(t => { t.enabled = !txMuted; });
      micUi();
      return;
    }
    micBtn.disabled = true;
    micMsg('Starting microphone');
    await startTxReporting();
    micBtn.disabled = false;
  });

  micSel.addEventListener('change', async () => {
    try { localStorage.setItem('mic', micSel.value); } catch (_) {}
    if (!txActive) return;                              // takes effect at the next start
    await stopTx();
    await startTxReporting();
  });

  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener)
    navigator.mediaDevices.addEventListener('devicechange', () => loadMics().catch(() => {}));

  // ---------- input ----------
  const send = (buf) => { if (ws && ws.readyState === 1) ws.send(buf); };

  // Screen position -> canvas pixel, undoing the CSS rotation (which is around the canvas centre).
  function mapXY(e) {
    const r = cv.getBoundingClientRect();        // bounding box of the rotated canvas, same centre as unrotated
    const dx = e.clientX - (r.left + r.width  / 2);
    const dy = e.clientY - (r.top  + r.height / 2);
    const a = rot * Math.PI / 180, cos = Math.round(Math.cos(a)), sin = Math.round(Math.sin(a));
    const lx =  dx * cos + dy * sin;             // inverse rotation: back into the canvas's own axes
    const ly = -dx * sin + dy * cos;
    const w = cv.offsetWidth, h = cv.offsetHeight;   // layout size, unaffected by the transform
    const x = Math.max(0, Math.min(cv.width  - 1, Math.round((lx + w / 2) * cv.width  / w)));
    const y = Math.max(0, Math.min(cv.height - 1, Math.round((ly + h / 2) * cv.height / h)));
    return [x, y];
  }
  function sendPtr(x, y, down) {
    const dv = new DataView(new ArrayBuffer(6));
    dv.setUint8(0, 0x10); dv.setUint8(1, down ? 1 : 0);
    dv.setUint16(2, x, true); dv.setUint16(4, y, true);
    send(dv.buffer);
  }

  let pending = null, raf = 0;
  function flushMove() { raf = 0; if (pending) { sendPtr(pending[0], pending[1], pending[2]); pending = null; } }

  cv.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;     // left button / touch / pen only
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    cv.focus({ preventScroll: true });
    pending = null;
    const [x, y] = mapXY(e); sendPtr(x, y, true);
  });
  cv.addEventListener('pointermove', (e) => {
    const [x, y] = mapXY(e);
    const down = e.pointerType === 'mouse' ? (e.buttons & 1) !== 0 : e.buttons !== 0;
    pending = [x, y, down];                      // keep only the latest, send once per frame
    if (!raf) raf = requestAnimationFrame(flushMove);
  });
  const up = (e) => {
    pending = null;
    const [x, y] = mapXY(e); sendPtr(x, y, false);
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('lostpointercapture', () => { /* release already sent by pointerup/cancel */ });

  let acc = 0;
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;     // lines -> pixels
    acc += dy;
    let n = 0;
    while (Math.abs(acc) >= 50 && n++ < 5) {
      const up = acc < 0;                                         // wheel up = +1, down = 255
      send(new Uint8Array([0x11, up ? 1 : 255]));
      acc += up ? 50 : -50;
    }
  }, { passive: false });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- fullscreen ----------
  document.getElementById('fsBtn').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else stage.requestFullscreen && stage.requestFullscreen();
  });

  // ---------- rotate ----------
  function setRot(deg) {
    rot = ((deg % 360) + 360) % 360;
    try { localStorage.setItem('rot', String(rot)); } catch (_) {}
    fit();
  }
  document.getElementById('rotBtn').addEventListener('click', () => setRot(rot + 90));

  // First visit on a phone held upright: start rotated so the landscape picture uses the full width.
  let saved = null;
  try { saved = localStorage.getItem('rot'); } catch (_) {}
  rot = saved !== null ? (parseInt(saved, 10) || 0) : (innerHeight > innerWidth ? 90 : 0);

  if (canSink) { sinkWrap.hidden = false; loadSinks().catch(() => {}); }   // hidden in browsers without setSinkId
  loadMics().catch(() => {});
  micUi();

  fit();
  connect();
})();
</script>
</body>
</html>
