<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDR remote</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #05070a;
    --bar: #10151c;
    --line: #232c38;
    --text: #d5dde8;
    --muted: #7f8c9d;
    --ok: #3ddc84;
    --warn: #f0b429;
    --bad: #ff5c5c;
    --accent: #4aa3ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  #status { display: flex; align-items: center; gap: 8px; margin-right: auto; color: var(--muted); }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
  #dot.ok { background: var(--ok); }
  #dot.bad { background: var(--bad); }

  button { font: inherit; color: var(--text); background: #1a222d; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button:hover { background: #222d3b; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #04121f; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #6bb5ff; }
  label.vol { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type=range] { width: 110px; accent-color: var(--accent); }

  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden; }
  canvas { display: block; background: #000; touch-action: none; user-select: none;
    -webkit-user-select: none; cursor: default; image-rendering: auto; }
  #stage:fullscreen { background: #000; }
</style>
</head>
<body>
<header>
  <div id="status"><span id="dot"></span><span id="statusText">Connecting</span></div>
  <label class="vol">Volume <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume"></label>
  <button id="audioBtn" class="primary" type="button">Start audio</button>
  <button id="rotBtn" type="button" title="Rotate the view by 90 degrees">Rotate</button>
  <button id="fsBtn" type="button">Full screen</button>
</header>
<div id="stage"><canvas id="c" width="1280" height="720" tabindex="0"></canvas></div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const audioBtn = document.getElementById('audioBtn');
  const volEl = document.getElementById('vol');

  // ---------- layout: fit canvas into the stage, keep aspect ratio ----------
  let rot = 0;                                   // view rotation in degrees: 0, 90, 180, 270 (clockwise)

  function fit() {
    const r = stage.getBoundingClientRect();
    const swapped = rot % 180 !== 0;             // at 90/270 the picture is as wide as the canvas is tall
    const vw = swapped ? cv.height : cv.width;
    const vh = swapped ? cv.width  : cv.height;
    const s = Math.min(r.width / vw, r.height / vh);
    cv.style.width  = Math.floor(cv.width  * s) + 'px';   // unrotated layout size
    cv.style.height = Math.floor(cv.height * s) + 'px';
    cv.style.transform = `rotate(${rot}deg)`;             // rotates around the canvas centre
  }
  new ResizeObserver(fit).observe(stage);

  function setStatus(text, cls) {
    statusText.textContent = text;
    dot.className = cls || '';
  }

  // ---------- WebSocket ----------
  let ws = null;
  let chain = Promise.resolve();      // keeps async-decoded tiles in draw order
  let retryTimer = null;

  function connect() {
    clearTimeout(retryTimer);
    setStatus('Connecting');
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => setStatus('Connected', 'ok');
    ws.onclose = () => {
      setStatus('Disconnected, retrying', 'bad');
      retryTimer = setTimeout(connect, 1000);
    };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };

    ws.onmessage = (e) => {
      const v = new DataView(e.data);
      switch (v.getUint8(0)) {
        case 0: {                                  // init: [0][u16 w][u16 h]
          cv.width  = v.getUint16(1, true);
          cv.height = v.getUint16(3, true);
          ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
          fit();
          setStatus(`Connected ${cv.width}\u00d7${cv.height}`, 'ok');
          break;
        }
        case 1: {                                  // tile: [1][codec][x][y][w][h][payload]
          const x = v.getUint16(2, true), y = v.getUint16(4, true);
          const mime = v.getUint8(1) === 0 ? 'image/jpeg' : 'image/webp';
          const bmp = createImageBitmap(new Blob([e.data.slice(10)], { type: mime }),
                                        { colorSpaceConversion: 'none' });
          chain = chain
            .then(() => bmp)
            .then(b => { ctx.drawImage(b, x, y); b.close(); })
            .catch(() => {});
          break;
        }
        case 2: {                                  // audio: [2][u32 seq][opus]
          if (decoder && decoder.state === 'configured' && decoder.decodeQueueSize < 10) {
            decoder.decode(new EncodedAudioChunk({
              type: 'key',
              timestamp: v.getUint32(1, true) * 20000,   // 20 ms frames, microseconds
              data: e.data.slice(5)
            }));
          }
          break;
        }
      }
    };
  }

  // ---------- audio ----------
  let ac = null, node = null, gain = null, decoder = null, audioState = 'off';

  async function startAudio() {
    if (!('AudioDecoder' in window)) {
      setStatus('Audio needs a secure page (https) and a browser with WebCodecs', 'bad');
      return;
    }
    ac = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
    await ac.audioWorklet.addModule('worklet.js');
    node = new AudioWorkletNode(ac, 'pcm', { numberOfInputs: 0, outputChannelCount: [1] });
    gain = ac.createGain();
    gain.gain.value = volEl.value / 100;
    node.connect(gain).connect(ac.destination);

    decoder = new AudioDecoder({
      output: (ad) => {
        const f = new Float32Array(ad.numberOfFrames);
        ad.copyTo(f, { planeIndex: 0, format: 'f32-planar' });
        node.port.postMessage(f, [f.buffer]);
        ad.close();
      },
      error: (err) => console.error('AudioDecoder', err)
    });
    const cfg = { codec: 'opus', sampleRate: 48000, numberOfChannels: 1 };
    const sup = await AudioDecoder.isConfigSupported(cfg);
    if (!sup.supported) { setStatus('This browser cannot decode Opus', 'bad'); return; }
    decoder.configure(cfg);
    audioState = 'on';
    audioBtn.textContent = 'Mute';
    audioBtn.classList.remove('primary');
  }

  audioBtn.addEventListener('click', async () => {
    if (audioState === 'off') { await startAudio(); return; }          // needs this user gesture
    if (audioState === 'on')  { await ac.suspend(); audioState = 'muted'; audioBtn.textContent = 'Unmute'; return; }
    await ac.resume(); audioState = 'on'; audioBtn.textContent = 'Mute';
  });
  volEl.addEventListener('input', () => { if (gain) gain.gain.value = volEl.value / 100; });

  // ---------- input ----------
  const send = (buf) => { if (ws && ws.readyState === 1) ws.send(buf); };

  // Screen position -> canvas pixel, undoing the CSS rotation (which is around the canvas centre).
  function mapXY(e) {
    const r = cv.getBoundingClientRect();        // bounding box of the rotated canvas, same centre as unrotated
    const dx = e.clientX - (r.left + r.width  / 2);
    const dy = e.clientY - (r.top  + r.height / 2);
    const a = rot * Math.PI / 180, cos = Math.round(Math.cos(a)), sin = Math.round(Math.sin(a));
    const lx =  dx * cos + dy * sin;             // inverse rotation: back into the canvas's own axes
    const ly = -dx * sin + dy * cos;
    const w = cv.offsetWidth, h = cv.offsetHeight;   // layout size, unaffected by the transform
    const x = Math.max(0, Math.min(cv.width  - 1, Math.round((lx + w / 2) * cv.width  / w)));
    const y = Math.max(0, Math.min(cv.height - 1, Math.round((ly + h / 2) * cv.height / h)));
    return [x, y];
  }
  function sendPtr(x, y, down) {
    const dv = new DataView(new ArrayBuffer(6));
    dv.setUint8(0, 0x10); dv.setUint8(1, down ? 1 : 0);
    dv.setUint16(2, x, true); dv.setUint16(4, y, true);
    send(dv.buffer);
  }

  let pending = null, raf = 0;
  function flushMove() { raf = 0; if (pending) { sendPtr(pending[0], pending[1], pending[2]); pending = null; } }

  cv.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;     // left button / touch / pen only
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    cv.focus({ preventScroll: true });
    pending = null;
    const [x, y] = mapXY(e); sendPtr(x, y, true);
  });
  cv.addEventListener('pointermove', (e) => {
    const [x, y] = mapXY(e);
    const down = e.pointerType === 'mouse' ? (e.buttons & 1) !== 0 : e.buttons !== 0;
    pending = [x, y, down];                      // keep only the latest, send once per frame
    if (!raf) raf = requestAnimationFrame(flushMove);
  });
  const up = (e) => {
    pending = null;
    const [x, y] = mapXY(e); sendPtr(x, y, false);
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('lostpointercapture', () => { /* release already sent by pointerup/cancel */ });

  let acc = 0;
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;     // lines -> pixels
    acc += dy;
    let n = 0;
    while (Math.abs(acc) >= 50 && n++ < 5) {
      const up = acc < 0;                                         // wheel up = +1, down = 255
      send(new Uint8Array([0x11, up ? 1 : 255]));
      acc += up ? 50 : -50;
    }
  }, { passive: false });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- fullscreen ----------
  document.getElementById('fsBtn').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else stage.requestFullscreen && stage.requestFullscreen();
  });

  // ---------- rotate ----------
  function setRot(deg) {
    rot = ((deg % 360) + 360) % 360;
    try { localStorage.setItem('rot', String(rot)); } catch (_) {}
    fit();
  }
  document.getElementById('rotBtn').addEventListener('click', () => setRot(rot + 90));

  // First visit on a phone held upright: start rotated so the landscape picture uses the full width.
  let saved = null;
  try { saved = localStorage.getItem('rot'); } catch (_) {}
  rot = saved !== null ? (parseInt(saved, 10) || 0) : (innerHeight > innerWidth ? 90 : 0);

  fit();
  connect();
})();
</script>
</body>
</html>
